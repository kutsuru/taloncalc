<!-- sidenav -->
<div class="drawer-sidenav">
  <div class="sidenav-content">
    <!-- static buttons -->
    <button mat-mini-fab (click)="ttSettings.showSettings()">
      <mat-icon>settings</mat-icon>
    </button>
    <!-- dynamic buttons for popups -->
    @if (ttSettings.popup.statsInfo) {
    <tt-popup-button [popup]="popStatsInfo" icon="info"></tt-popup-button>
    }
    @if (ttSettings.popup.buffs) {
    <tt-popup-button [popup]="popBuffs" icon="auto_awesome"></tt-popup-button>
    }
  </div>
</div>
<!-- page loader -->
<tt-page-loader></tt-page-loader>
<!-- popups -->
<tt-popup-group>
  <tt-popup #popStatsInfo>
    <tt-stats-info></tt-stats-info>
  </tt-popup>
  <tt-popup #popBuffs>
    <tt-buff></tt-buff>
  </tt-popup>
</tt-popup-group>
<!-- settings -->
<tt-settings></tt-settings>
