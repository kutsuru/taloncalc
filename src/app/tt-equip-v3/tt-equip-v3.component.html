<!-- Left & right hand -->
<div class="option-container">
    <mat-form-field>
        <mat-label>Waepon Type</mat-label>
        <mat-select [value]="session.rightHandType()" (selectionChange)="session.updateRightHandType($event.value)">
            @for (wT of weaponTypes(); track $index) {
            <mat-option [value]="wT"> {{wT}} </mat-option>
            }
        </mat-select>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Left Hand Type</mat-label>
        <mat-select [value]="session.leftHandType()" (selectionChange)="session.updateLeftHandType($event.value)">
            @for (wT of leftHandTypes(); track $index) {
            <mat-option [value]="wT"> {{wT}} </mat-option>
            }
        </mat-select>
    </mat-form-field>
</div>
<!-- Equips -->
<div class="equip-container">
    <div class="equip-left">
        <tt-equip-slot [slot]="equip.upperHg.slot" [meta]="equip.upperHg.meta" />
        <tt-equip-slot [slot]="equip.lowerHg.slot" [meta]="equip.lowerHg.meta" />
        <tt-equip-slot [slot]="equip.rightHand.slot" [meta]="equip.rightHand.meta" />
        <tt-equip-slot [slot]="equip.garment.slot" [meta]="equip.garment.meta" />
        <tt-equip-slot [slot]="equip.rhAccessory.slot" [meta]="equip.rhAccessory.meta" />
    </div>
    <div class="equip-avatar">
        <class-avatar />
    </div>
    <div class="equip-right">
        <tt-equip-slot [slot]="equip.middleHg.slot" [meta]="equip.middleHg.meta" />
        <tt-equip-slot [slot]="equip.armor.slot" [meta]="equip.armor.meta" />
        <tt-equip-slot [slot]="equip.leftHand.slot" [meta]="equip.leftHand.meta" />
        <tt-equip-slot [slot]="equip.shoes.slot" [meta]="equip.shoes.meta" />
        <tt-equip-slot [slot]="equip.lhAccessory.slot" [meta]="equip.lhAccessory.meta" />
    </div>
</div>
