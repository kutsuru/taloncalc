<mat-form-field class="tt-key-select">
  <mat-label>{{ name }}</mat-label>
  <mat-select
    [(value)]="_serviceData[key]"
    (selectionChange)="onSelectionChange($event)"
  >
    @if (defaultValue) {
<mat-option [value]="defaultValue">
      {{ defaultValue }}
    </mat-option>
}
    @for (item of data; track item) {
<mat-option [value]="item">
      {{ item }}
    </mat-option>
}
  </mat-select>
</mat-form-field>
