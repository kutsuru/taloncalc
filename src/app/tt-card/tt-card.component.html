<div>
    <mat-expansion-panel [expanded]="expanded()" class="expansion-outlined"
        [class.allow-overflow]="allowOverflow()"
        (closed)="setOverflow(false)"
        (afterExpand)="setOverflow(true)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                <ng-content select="header"></ng-content>
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-content></ng-content>
    </mat-expansion-panel>
</div>
