<mat-card (click)="toggle()" [appearance]="appearance()" class="equip-tile" [class.disabled]="disabled()"
    [matTooltip]="fullName()">
    @if (itemSelected()) {
    <!-- item selected -->
    <img [src]="imgItemId()|talonurl" />
    }
    @else {
    <!-- no item -->
    <span class="placeholder">+</span>
    }
</mat-card>
@if (isOpen()) {
<tt-equip-slot-popup [slot]="slot()" [jobItems]="jobItems()" [cardType]="cardType()" (closed)="toggle()" />
}
