<mat-card (click)="toggle()" [appearance]="appearance()" class="equip-tile" matRipple>
    @if (itemSelected()) {
    <!-- item selected -->
    <img [src]="state().item|talonurl" />
    }
    @else {
    <!-- no item -->
    <span class="placeholder">+</span>
    }
</mat-card>
@if (isOpen()) {
    <tt-equip-slot-popup [meta]="meta()" [slot]="slot()" (closed)="toggle()"/>
}
